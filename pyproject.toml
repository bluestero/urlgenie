[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urlgenie"
version = "2.0.4"
description = "URL generalization, contact extraction and validation, RFC 3986 compliant."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ahmed Khatib", email = "ahmedkhatib99@gmail.com" }]
dependencies = ["tldextract>=3.0"]
keywords = ["url", "url-parsing", "rfc3986", "data-cleaning", "social-media", "validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/bluestero/urlgenie"
Tracker = "https://github.com/bluestero/urlgenie/issues"

[tool.setuptools.packages.find]
include = ["urlgenie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
